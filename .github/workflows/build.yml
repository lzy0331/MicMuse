name: build

on:
  push:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解包源码
        run: |
          mkdir -p src
          tar -xzf MicMuse.tar.gz -C src
          ls src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 NDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 配置 Maven 镜像
        run: |
          cat > "$RUNNER_TEMP/mirror.init.gradle" <<'INIT'
          def addMirrors = { repos ->
              repos.maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              repos.maven { url 'https://maven.aliyun.com/repository/public' }
              repos.maven { url 'https://maven.aliyun.com/repository/google' }
          }
          try {
              beforeSettings { settings ->
                  addMirrors(settings.pluginManagement.repositories)
                  addMirrors(settings.dependencyResolutionManagement.repositories)
              }
              allprojects { addMirrors(repositories) }
              println "镜像已注入"
          } catch (Throwable t) {
              println "镜像注入失败(不影响后续): " + t
          }
          INIT

      - name: 构建 APK
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试 ==="
            gradle -p src --init-script "$RUNNER_TEMP/mirror.init.gradle" :app:assembleDebug --no-daemon && exit 0
            sleep 20
          done
          exit 1

      - name: 构建注入模块
        run: |
          cd src
          git clone --depth 1 https://github.com/Dr-TSNG/ZygiskNDK
          NDK="$ANDROID_HOME/ndk/27.0.12077973" ZYGISK_NDK="$PWD/ZygiskNDK" bash module/build.sh
          cd module/build/out
          zip -r "$GITHUB_WORKSPACE/micmuse-module.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: micmuse-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: micmuse-module-zip
          path: micmuse-module.zip
