name: build

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解包源码
        run: |
          mkdir -p src
          tar -xzf MicMuse.tar.gz -C src
          ls src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 配置 Maven 镜像
        run: |
          cat > "$RUNNER_TEMP/mirror.init.gradle" <<'INIT'
          def addMirrors = { repos ->
              repos.maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              repos.maven { url 'https://maven.aliyun.com/repository/public' }
              repos.maven { url 'https://maven.aliyun.com/repository/google' }
          }
          try {
              beforeSettings { settings ->
                  addMirrors(settings.pluginManagement.repositories)
                  addMirrors(settings.dependencyResolutionManagement.repositories)
              }
              allprojects { addMirrors(repositories) }
          } catch (Throwable t) {
              println "镜像注入失败(忽略): " + t
          }
          INIT

      - name: 构建 APK
        run: |
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试 ==="
            gradle -p src --init-script "$RUNNER_TEMP/mirror.init.gradle" :app:assembleDebug --no-daemon && exit 0
            sleep 20
          done
          exit 1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: micmuse-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk

      - name: 安装 NDK
        continue-on-error: true
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;27.0.12077973"

      - name: 构建注入模块
        continue-on-error: true
        run: |
          set +e
          exec > >(tee build.log) 2>&1
          git clone --depth 1 https://github.com/topjohnwu/zygisk-module-sample "$RUNNER_TEMP/zndk"
          ls -l "$RUNNER_TEMP/zndk/module/jni/"
          cd src/module
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DZYGISK_NDK="$RUNNER_TEMP/zndk" \
            -DZYGISK_INCLUDE="$RUNNER_TEMP/zndk/module/jni" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          mkdir -p out/zygisk
          cp build/zygisk-micmuse.so out/zygisk/arm64.so 2>/dev/null || cp build/libzygisk-micmuse.so out/zygisk/arm64.so
          cp module.prop targets.conf out/
          ls -lR out
          cd out && zip -r "$GITHUB_WORKSPACE/micmuse-module.zip" .

      - name: 把构建日志提交回仓库
        if: always()
        run: |
          cp build.log build-log.txt 2>/dev/null || echo "(no log)" > build-log.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "ci: 构建日志" || true
          git push || true

      - name: 上传注入模块
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micmuse-module-zip
          path: micmuse-module.zip
          if-no-files-found: warn
